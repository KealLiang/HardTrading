<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ChanLens 缠论透镜</title>
  <link rel="stylesheet" href="../ui/panel.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-bar">
    <span id="logoBtn" class="app-logo" title="缠论实操速查（心法）· 点击查看">缠</span>
    <span class="app-name">ChanLens 缠论透镜</span>

    <div class="app-search">
      <input id="search" type="text" autocomplete="off" placeholder="输入代码或拼音/汉字，如 600519 / 茅台">
      <div id="suggest" class="app-suggest hidden"></div>
    </div>

    <div class="app-cur">
      <span id="curName" class="app-cur-name">未选择标的</span>
      <span id="curCode" class="app-cur-code"></span>
    </div>

    <div class="app-actions">
      <!-- 图表类快捷操作（全览/重算/切换…）由 CLPanel.CHART_ACTIONS 渲染，见 app.js -->
      <span class="app-chart-tools"></span>
      <span class="app-hint">Alt+↑/↓ 切换自选</span>
    </div>
  </header>

  <div class="app-body">
    <aside class="app-side">
      <div class="app-side-head">
        <span>自选股</span>
        <span class="app-side-tools">
          <!-- 动作按钮由 CLPanel.ACTIONS 渲染（见 app.js） -->
        </span>
      </div>
      <ul id="watchlist" class="app-list"></ul>
      <div id="sideTip" class="app-tip">右键标的：移动/删除　右键分类名：重命名/删除　拖动标的到分类名可移动　Alt+↑/↓ 切换。</div>
    </aside>
    <main id="stage" class="app-stage"></main>
  </div>

  <div id="importModal" class="app-modal hidden">
    <div class="app-modal-box">
      <div class="app-modal-head">批量导入自选</div>
      <textarea id="importText" spellcheck="false" rows="9"
        placeholder="一行一个，或用逗号 / 空格 / 分号分隔，可混写名称：&#10;600519&#10;SH600036&#10;000001, 300750&#10;601318 中国平安"></textarea>
      <div id="importPreview" class="app-modal-preview"></div>
      <div class="app-modal-row">
        <span class="app-hint">导入到分类</span>
        <select id="importCat"></select>
      </div>
      <div class="app-modal-foot">
        <span id="importStat" class="app-hint"></span>
        <button id="importCancel" class="cl-btn">取消</button>
        <button id="importOk" class="cl-btn cl-primary">导入 (Ctrl+Enter)</button>
      </div>
    </div>
  </div>

  <div id="delModal" class="app-modal hidden">
    <div class="app-modal-box">
      <div class="app-modal-head">批量删除自选股</div>
      <div class="app-modal-tip">勾选要删除的标的，确认后不可恢复。点分类可只勾该类（再点恢复全选），分类本身不会被删。</div>
      <div id="delCatRow" class="app-del-cats"></div>
      <div id="delList" class="app-modal-list"></div>
      <div class="app-modal-foot">
        <span id="delStat" class="app-hint"></span>
        <button id="delToggle" class="cl-btn">全不选</button>
        <button id="delCancel" class="cl-btn">取消</button>
        <button id="delOk" class="cl-btn cl-primary">删除 (Ctrl+Enter)</button>
      </div>
    </div>
  </div>

  <div id="catModal" class="app-modal hidden">
    <div class="app-modal-box app-modal-narrow">
      <div id="catModalHead" class="app-modal-head">新建分类</div>
      <input id="catName" type="text" maxlength="16" spellcheck="false" placeholder="分类名，如 核心池 / 观察池">
      <div class="app-modal-foot">
        <span id="catErr" class="app-hint"></span>
        <button id="catCancel" class="cl-btn">取消</button>
        <button id="catOk" class="cl-btn cl-primary">确定</button>
      </div>
    </div>
  </div>

  <div id="ctxMenu" class="app-ctx hidden"></div>

  <div id="mantraModal" class="app-modal hidden">
    <div class="app-modal-box app-mantra">
      <div class="app-modal-head">缠论实操速查 · 心法</div>
      <div class="app-mantra-body"></div>
      <div class="app-modal-foot">
        <span class="app-hint">时刻牢记 · 防犹豫内耗</span>
        <button id="mantraClose" class="cl-btn cl-primary">知道了</button>
      </div>
    </div>
  </div>

  <!-- 1.6.0 缠论追踪 · 作战卡：长按自选列表项 → 追踪 → 三句话。
       1.7.0：方向由信号自带（买点做多 / 卖点做空），trackDirRow 不再放方向
       pill，app.js 会把它整行隐藏；留着这个 id 是为了不让老页面报错。 -->
  <div id="trackModal" class="app-modal hidden">
    <div class="app-modal-box app-track">
      <div class="app-modal-head" id="trackHead">缠论追踪 · 作战卡</div>
      <div id="trackDirRow" class="app-track-dir"></div>
      <div id="trackBody" class="app-track-body"></div>
      <div class="app-modal-foot">
        <span class="app-hint">写下才许下单 · 参考非指令</span>
        <button id="trackCancel" class="cl-btn">关闭</button>
        <button id="trackOk" class="cl-btn cl-primary">确认追踪</button>
      </div>
    </div>
  </div>

  <script src="../core/indicators.js"></script>
  <script src="../core/chan.js"></script>
  <script src="../core/market.js"></script>
  <script src="../chart/renderer.js"></script>
  <script src="../chart/mergedview.js"></script>
  <script src="../ui/panel.js"></script>
  <script src="../core/scanner.js"></script>
  <script src="../core/track.js"></script>
  <script src="../content/datasource.js"></script>
  <script src="mantra-content.js"></script>
  <script src="app.js"></script>
</body>
</html>
